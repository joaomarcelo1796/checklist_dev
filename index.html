<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Checklist: Dev Web Freelancer</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f6f7fb;--card:#fff;--tx:#1b1f2a;--mut:#6b7280;--bd:#e3e6ee;--ac:#4f46e5;--ok:#16a34a}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1117;--card:#181b24;--tx:#e8eaf0;--mut:#9aa1b2;--bd:#2a2f3c;--ac:#818cf8;--ok:#4ade80}}
:root[data-theme="dark"]{--bg:#0f1117;--card:#181b24;--tx:#e8eaf0;--mut:#9aa1b2;--bd:#2a2f3c;--ac:#818cf8;--ok:#4ade80}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.5}
main{max-width:760px;margin:0 auto;padding:20px 16px 60px}
h1{font-size:1.5rem;margin:0 0 4px}
.sub{color:var(--mut);margin:0 0 16px;font-size:.95rem}
.top{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);padding:10px 0;z-index:5}
.bar{height:10px;background:var(--bd);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--ac);transition:width .3s}
.row{display:flex;gap:8px;align-items:center;margin-top:8px;flex-wrap:wrap}
.row b{font-size:.9rem}
input[type=search]{flex:1;min-width:140px;padding:8px 10px;border:1px solid var(--bd);border-radius:8px;background:var(--card);color:var(--tx);font:inherit}
button{padding:8px 12px;border:1px solid var(--bd);border-radius:8px;background:var(--card);color:var(--tx);font:inherit;cursor:pointer}
details{background:var(--card);border:1px solid var(--bd);border-radius:12px;margin:10px 0;overflow:hidden}
summary{cursor:pointer;padding:12px 14px;display:flex;align-items:center;gap:10px;font-weight:600;list-style:none}
summary::-webkit-details-marker{display:none}
summary .n{margin-left:auto;font-weight:400;color:var(--mut);font-size:.85rem}
summary.done .n{color:var(--ok);font-weight:600}
.mini{height:4px;background:var(--bd)}
.mini i{display:block;height:100%;background:var(--ok);width:0;transition:width .3s}
ul{list-style:none;margin:0;padding:6px 14px 12px}
li label{display:flex;gap:10px;align-items:flex-start;padding:7px 0;cursor:pointer}
li input{margin-top:5px;accent-color:var(--ac);width:18px;height:18px;flex:none}
li.ck span{text-decoration:line-through;color:var(--mut)}
li.hide{display:none}
.ord{font-size:.85rem;color:var(--mut);margin-top:18px}
</style>
</head>
<body>
<main>
<h1>Checklist: Dev Web Freelancer</h1>
<p class="sub">Marque os itens conforme estudar. Seu progresso fica salvo neste navegador.</p>
<div class="top">
<div class="bar"><i id="pb"></i></div>
<div class="row"><b id="pt">0%</b><input type="search" id="q" placeholder="Buscar tema..."><button id="rs">Zerar</button></div>
</div>
<div id="app"></div>
<p class="ord"><b>Ordem sugerida:</b> Git → Front-end → SQL → Back-end → Segurança → Normas → Deploy → Negócio → WordPress, Design e IA em paralelo.</p>
</main>
<script>
const D=[
["1. Front-end","HTML semântico|Acessibilidade em HTML (aria, alt, labels)|CSS: Flexbox|CSS: Grid|CSS: variáveis, clamp(), media queries|Design responsivo (mobile-first)|JavaScript: DOM e eventos|JavaScript: async/await e fetch|JavaScript: módulos ES6 e tratamento de erros|Tailwind CSS|React|Next.js"],
["2. Back-end","Node.js|Express|API REST (rotas, métodos, status codes, JSON)|Autenticação (sessões, JWT, cookies seguros)|Autorização (permissões e papéis)|Envio de e-mail (Resend, Nodemailer)|Upload de arquivos|Webhooks|Pagamentos (Pix, Mercado Pago, Stripe)"],
["3. Banco de dados","SQL: SELECT, INSERT, UPDATE, DELETE|SQL: JOIN, GROUP BY|Modelagem (PK, FK, relacionamentos 1:N e N:N)|Normalização|PostgreSQL|MySQL (básico)|Índices|Migrations|Backup|Supabase (com RLS)|Firebase|ORM (Prisma ou Drizzle)"],
["4. Segurança","OWASP Top 10|SQL Injection|XSS|CSRF|Hash de senha (bcrypt/argon2)|Variáveis de ambiente e .env|HTTPS|Headers de segurança (CSP, HSTS, X-Frame-Options)|CORS|Validação no servidor (Zod)|Rate limiting|Proteção contra bots (reCAPTCHA, Turnstile)|npm audit e atualização de dependências|Princípio do menor privilégio"],
["5. Normas e conformidade","LGPD: política de privacidade|LGPD: consentimento e banner de cookies|LGPD: direitos do titular|WCAG (contraste, teclado, leitores de tela)|SEO: meta tags|SEO: sitemap e robots.txt|SEO: dados estruturados|Core Web Vitals (LCP, CLS, INP)|Termos de uso"],
["6. Ferramentas e infraestrutura","Git: commits e branches|Git: pull requests e reverter alterações|GitHub|Terminal (Bash/Linux)|DevTools do navegador|Deploy (Vercel, Netlify, Cloudflare)|VPS (Hostinger, DigitalOcean)|Domínio e DNS (Registro.br, Cloudflare)|Certificado SSL|GitHub Actions (CI/CD)|Lighthouse|securityheaders.com|Mozilla Observatory"],
["7. WordPress","Instalação e configuração|Temas|Plugins|Elementor|Segurança e backup|PHP básico"],
["8. Design","Hierarquia visual|Tipografia|Teoria das cores|Espaçamento e grid|Figma|UX básico (fluxo do usuário, formulários)|Referências (Dribbble, Behance, Awwwards)"],
["9. Trabalhar com IA","Ler e revisar código gerado|Prompts com contexto|Pedir revisão de segurança|Refatoração|Testes manuais antes de entregar|Nunca expor chaves e senhas no chat"],
["10. Freelancer e negócio","Precificação (hora, projeto, manutenção)|Proposta e orçamento|Contrato e escopo|Pagamento em etapas|Gestão de expectativas com cliente|MEI e nota fiscal|Portfólio (3 a 5 projetos)|Site pessoal|Prospecção (Instagram, WhatsApp, LinkedIn, indicação)|Workana e 99Freelas|Manutenção mensal (renda recorrente)"]
];
const K="checklist-dev-freelancer";
let S={};
try{S=JSON.parse(localStorage.getItem(K)||"{}")}catch(e){S={}}
function save(){try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}}
const app=document.getElementById("app");
D.forEach(([t,items],si)=>{
  const d=document.createElement("details");d.open=si===0;
  const list=items.split("|");
  d.innerHTML='<summary><span>'+t+'</span><span class="n"></span></summary><div class="mini"><i></i></div><ul>'+
    list.map((x,i)=>'<li data-k="'+si+'-'+i+'"><label><input type="checkbox"><span>'+x.replace(/&/g,"&amp;").replace(/</g,"&lt;")+'</span></label></li>').join("")+'</ul>';
  app.appendChild(d);
});
function refresh(){
  let tot=0,done=0;
  app.querySelectorAll("details").forEach(d=>{
    const lis=d.querySelectorAll("li");let c=0;
    lis.forEach(li=>{const on=!!S[li.dataset.k];li.classList.toggle("ck",on);li.querySelector("input").checked=on;if(on)c++});
    const s=d.querySelector("summary");
    s.querySelector(".n").textContent=c+"/"+lis.length;
    s.classList.toggle("done",c===lis.length);
    d.querySelector(".mini i").style.width=(c/lis.length*100)+"%";
    tot+=lis.length;done+=c;
  });
  const p=Math.round(done/tot*100);
  document.getElementById("pb").style.width=p+"%";
  document.getElementById("pt").textContent=p+"% ("+done+"/"+tot+")";
}
app.addEventListener("change",e=>{
  const li=e.target.closest("li");if(!li)return;
  if(e.target.checked)S[li.dataset.k]=1;else delete S[li.dataset.k];
  save();refresh();
});
document.getElementById("q").addEventListener("input",e=>{
  const v=e.target.value.toLowerCase().trim();
  app.querySelectorAll("details").forEach(d=>{
    let any=false;
    d.querySelectorAll("li").forEach(li=>{
      const m=!v||li.textContent.toLowerCase().includes(v);
      li.classList.toggle("hide",!m);if(m)any=true;
    });
    d.style.display=any?"":"none";
    if(v&&any)d.open=true;
  });
});
document.getElementById("rs").addEventListener("click",()=>{
  if(confirm("Zerar todo o progresso?")){S={};save();refresh()}
});
refresh();
</script>
</body>
</html>
